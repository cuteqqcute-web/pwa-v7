<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <title>V7 提示音選擇測試</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 15px; background: #f5f5f7; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 24px; color: #1d1d1f; margin-bottom: 20px; text-align: center; }
        .sound-card { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 320px; gap: 8px; transition: transform 0.2s; border: 1px solid #e5e5ea; }
        .sound-card:active { transform: scale(0.98); }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 12px; border: 1px solid #d2d2d7; background: #fff; font-weight: 600; color: #1d1d1f; width: 100%; transition: all 0.2s; }
        button:active { background: #e5e5ea; }
        .desc { font-size: 13px; color: #86868b; text-align: center; }
        .section-title { font-size: 14px; font-weight: 600; color: #86868b; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <h1>🔊 V7 提示音選擇</h1>
    
    <div class="section-title">合成音 (无需加载文件)</div>
    <div class="sound-card">
        <button onclick="playA()">方案 A</button>
        <div class="desc">電子合成音 (簡潔嗶聲)</div>
    </div>
    <div class="sound-card">
        <button onclick="playF()">方案 F</button>
        <div class="desc">極短快擊 (低調確認)</div>
    </div>

    <div class="section-title">音效檔 (需網路加載)</div>
    <div class="sound-card">
        <button onclick="playB()">方案 B</button>
        <div class="desc">現代通知 (清脆叮聲)</div>
    </div>
    <div class="sound-card">
        <button onclick="playC()">方案 C</button>
        <div class="desc">溫馨成功 (輕盈叮咚)</div>
    </div>
    <div class="sound-card">
        <button onclick="playD()">方案 D</button>
        <div class="desc">專業提示 (穩重低音)</div>
    </div>
    <div class="sound-card">
        <button onclick="playE()">方案 E</button>
        <div class="desc">亮眼提醒 (高頻清脆)</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSine(freq, duration, volume = 0.1) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playA() { playSine(880, 0.2); }
        function playF() { playSine(440, 0.05, 0.05); }
        
        function playB() { new Audio('https://actions.google.com/sounds/v1/notifications/beep.ogg').play(); }
        function playC() { new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play(); }
        function playD() { new Audio('https://actions.google.com/sounds/v1/notifications/notification_low_intensity.ogg').play(); }
        function playE() { new Audio('https://actions.google.com/sounds/v1/notifications/notification_high_intensity.ogg').play(); }
    </script>
</body>
</html>
