<!DOCTYPE html>
<html lang="zh-TW">
<head>
<head>
    <title>V7 提示音選擇 (穩定合成版)</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 15px; background: #f5f5f7; margin: 0; padding: 20px; box-sizing: border-box; }
        h1 { font-size: 24px; color: #1d1d1f; margin-bottom: 20px; text-align: center; }
        .sound-card { background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 320px; gap: 8px; transition: transform 0.2s; border: 1px solid #e5e5ea; }
        .sound-card:active { transform: scale(0.98); }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 12px; border: 1px solid #d2d2d7; background: #fff; font-weight: 600; color: #1d1d1f; width: 100%; transition: all 0.2s; }
        button:active { background: #e5e5ea; }
        .desc { font-size: 13px; color: #86868b; text-align: center; }
        .section-title { font-size: 14px; font-weight: 600; color: #86868b; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <h1>🔊 V7 提示音選擇</h1>
    <div class="section-title">全合成音 (100% 相容)</div>
    
    <div class="sound-card">
        <button onclick="playA()">方案 A</button>
        <div class="desc">極簡電子 (經典嗶聲)</div>
    </div>
    <div class="sound-card">
        <button onclick="playB()">方案 B</button>
        <div class="desc">現代通知 (清脆雙音)</div>
    </div>
    <div class="sound-card">
        <button onclick="playC()">方案 C</button>
        <div class="desc">溫馨成功 (和諧叮咚)</div>
    </div>
    <div class="sound-card">
        <button onclick="playD()">方案 D</button>
        <div class="desc">專業提示 (穩重低音)</div>
    </div>
    <div class="sound-card">
        <button onclick="playE()">方案 E</button>
        <div class="desc">醒目提醒 (高頻提示)</div>
    </div>
    <div class="sound-card">
        <button onclick="playF()">方案 F</button>
        <div class="desc">低調確認 (極短擊發)</div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, duration, volume = 0.1, type = 'sine', ramp = true) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            if (ramp) {
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            }
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playA() { playTone(880, 0.2); }
        
        function playB() { 
            playTone(660, 0.1); 
            setTimeout(() => playTone(880, 0.15), 100); 
        }
        
        function playC() { 
            playTone(523.25, 0.15, 0.1); // C5
            setTimeout(() => playTone(659.25, 0.3, 0.1), 150); // E5
        }
        
        function playD() { playTone(220, 0.3, 0.15); }
        
        function playE() { 
            playTone(1200, 0.05, 0.05); 
            setTimeout(() => playTone(1500, 0.05, 0.05), 80); 
        }
        
        function playF() { playTone(330, 0.05, 0.05, 'square'); }
    </script>
</body>
</html>
