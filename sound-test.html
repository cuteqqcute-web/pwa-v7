<!DOCTYPE html>
<html>
<head>
    <title>V7 提示音測試</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 20px; background: #f5f5f7; margin: 0; }
        h1 { font-size: 24px; color: #1d1d1f; margin-bottom: 20px; }
        button { padding: 20px 40px; font-size: 18px; cursor: pointer; border-radius: 15px; border: 1px solid #ddd; transition: 0.2s; width: 80%; max-width: 300px; font-weight: 600; }
        button:active { transform: scale(0.95); }
        .btn-a { background: #fff; color: #1d1d1f; }
        .btn-b { background: #eaf2fd; color: #0071e3; }
        .btn-c { background: #d0e4f9; color: #004a99; }
        .desc { font-size: 14px; color: #86868b; text-align: center; margin-top: -10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🔊 V7 提示音選擇</h1>
    
    <button class="btn-a" onclick="playA()">方案 A</button>
    <div class="desc">電子合成音 (簡潔嗶聲)</div>
    
    <button class="btn-b" onclick="playB()">方案 B</button>
    <div class="desc">短促通知音 (叮!)</div>
    
    <button class="btn-c" onclick="playC()">方案 C</button>
    <div class="desc">成功完成音 (叮咚~)</div>

    <script>
        function playA() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        }
        function playB() {
            new Audio('https://actions.google.com/sounds/v1/notifications/beep.ogg').play();
        }
        function playC() {
            new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
        }
    </script>
</body>
</html>
